{% extends 'base.html' %}

{% block title %}Реєстрація — LaserStrike Arena{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-arena p-4">
                <h2 class="text-center text-white mb-4"><i class="bi bi-person-plus me-2 text-neon-green"></i>Реєстрація</h2>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label text-light">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-neon w-100 fw-bold py-2 mt-3">Створити акаунт</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Вже є акаунт? <a href="{% url 'login' %}" class="text-neon-green text-decoration-none">Увійти</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
